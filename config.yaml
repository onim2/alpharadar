# ═══════════════════════════════════════════════════════
# AlphaRadar v3.2 — 파라미터 설정 (단일 진실 공급원)
# 정형:비정형 = 6:4 (v3.2 docstring 의도와 정렬)
# 등급 임계값 75/65 (2026-05-22 00:49 run과 동일 분포)
# ═══════════════════════════════════════════════════════

# ── Step 0: 유니버스 필터 ──────────────────────────────
universe:
  min_price: 500                   # 최소 주가 (원) — 500원 미만 동전주 제외
  # 300억 → 2000억 (2026-08-21). 추천 종목이 극소형에 쏠려 있었고, 그 구간이
  # 실제로 돈을 잃는 구간이었다. 추천(scan) 65거래일 일자내 초과수익:
  #   ~1000억      n=618  fwd1 -0.61  fwd5 -3.74  fwd10 -5.55  fwd20 -5.55  승률 28%
  #   1000~2000억  n=496  fwd1 -0.24  fwd5 -0.28  fwd10 -0.41  fwd20 -2.50  승률 36%
  #   2000~3000억  n=483  fwd1 +0.43  fwd5 +0.39  fwd10 +1.73  fwd20 +3.64  승률 53%
  # 부호가 2000억에서 갈리고, 그 아래는 지평이 길수록 악화된다 — 단타 지평
  # (fwd1·fwd5)에서도 이미 음수라 보유 기간을 줄여 피할 수 있는 문제가 아니다.
  # 최근 30일 추천 455건 중 34%(153건)가 이 구간이었다.
  #
  # 2000억에서 끊고 2000~3000억은 남긴다. 실투자 기준은 3000억 이상이지만
  # 그 구간 자체는 성과가 좋아(fwd20 +3.64·승률 53%) 관찰 가치가 있다.
  min_market_cap: 200_000_000_000  # 최소 시가총액 2000억 — 극소형·소형 제외
  min_listed_days: 126             # 최소 상장일수 126일(약 6개월) — 신규상장 제외
  lookback_days: 125               # 데이터 조회 기간 — MA120 계산에 120일 필요

  # 수급 5일 창에서 당일을 뺀다. 아침 런(06:10)은 당일 집계 전이라 D-1..D-5를 보고
  # 저녁 런(18:40)은 당일이 집계돼 D..D-4를 봐서, 같은 scan_date의 두 런이 서로 다른
  # 창을 본다. 그 탓에 net_buy_days가 뒤집혀 engine_a가 꺼지고 D점수 base가 50→20으로
  # 움직인다(총점 9점). 실측: 다중 런 1,500 종목일 중 576건에서 순매수일이 변했고,
  # 엔진이 바뀐 231건의 총점 변동 평균 10.64 vs 안 바뀐 1,269건 1.56 — 7배 차이.
  # 당일 수급은 버려지지 않고 다음 런(D+1 아침)에 D-1로 들어온다.
  investor_exclude_today: true

# ── Step 1: 신호 탐지 ─────────────────────────────────
engine_a:
  net_buy_min_days: 3              # 5일 중 최소 3일 기관+외인 순매수여야 신호 ON
  vol_surge_pct: 0.50              # 최근 5일 거래량이 60일 평균 대비 50% 이상이면 신호 ON
  require_positive_total: true     # Task2: 순매수 일수 충족이어도 합계 음수면 매집 불인정

engine_b:
  hype_trend_days: 7               # 네이버 DataLab 검색량 추세 기간 (기울기 계산)
  max_negative_sentiment: 0.30     # 부정 뉴스 비율 30% 이상이면 엔진 B 신호 차단
  hype_top_n: 500                  # DataLab 호출 대상 종목 수 (거래량 상위 N개)
  hype_workers: 3                  # DataLab 병렬 호출 수 (Naver burst 한계 ~10/s, 3 권장)

# ── Step 2: 시가총액 구간 정의 ────────────────────────
cap_tier:
  large_threshold: 5_000_000_000_000   # 5조 이상 = 대형
  mid_threshold:     500_000_000_000   # 5000억 이상 = 중형
  # 5000억 미만 = 소형

# ── Step 2: 하드 필터 ─────────────────────────────────
filter:
  # ① 이격도 상한 — 단기 과열 제거 (추격매수 금지)
  max_disparity_large: 110         # 대형주: MA20 대비 +10% 이상이면 과열
  max_disparity_mid:   115         # 중형주: MA20 대비 +15% 이상이면 과열
  max_disparity_small: 120         # 소형주: MA20 대비 +20% 이상이면 과열

  # ② 이격도 하한 — MA20 아래 하락 추세 제거
  min_disparity: 93                # MA20 대비 -7%(93%) 미만 = 하락 추세

  # ③ MA 방향성 — 단기 이평이 장기 이평 위에 있어야 상승 추세 인정
  require_ma_trend: true           # MA20 > MA120 조건

  # ④ RSI 과매수 상한 — 단기 극과열 제거
  max_rsi: 70                      # RSI 70 초과 시 제거

  # ⑤ 거래대금 최소 기준 — 두 조건 모두 충족해야 통과
  min_turnover_ratio: 0.01         # 일 거래대금 / 시총 >= 1%
  min_turnover_amount: 2_000_000_000  # 일 거래대금 절대값 >= 20억

  # 섹터 동조화 보너스 (하드 필터 아님 — D 점수 +5에만 영향)
  min_sector_peers: 2              # Pool B 내 같은 섹터 종목이 2개 이상일 때 보너스

  # ⑥ 신용등급 제외 (master universe 보강 등급 기반) — 기본 빈 목록 = 제외 없음(현행 유지)
  #    채권(적용등급) 또는 CP 등급이 목록에 들면 유니버스에서 제외. 등급 없는 종목은 영향 없음.
  #    예: ["B+","B","B-","CCC+","CCC","CCC-","CC","C","D"]
  exclude_ratings: []

  # ⑦ 과열 배제 (Task3) — 이미 급등/고점 근접 종목 제외 (물밑 포착 목적 정렬)
  #    셋 중 하나라도 초과하면 제외 + gated_tickers에 반사실 기록.
  exclude_overheat:
    enabled: true
    max_ret_5d: 0.20             # 최근 5거래일 누적수익률 +20% 초과 제외
    max_ret_20d: 0.40            # 최근 20거래일 누적수익률 +40% 초과 제외
    max_w52_proximity: 0.97      # 현재가/기간내고가 0.97 초과(고점 근접) 제외

# ── Step 3: 스코어링 ───────────────────────────────────
scoring:
  # 가중치 — 세 값의 합이 반드시 1.0이어야 함
  # 정형:비정형 = 6:4  (T+D = 0.60, S_text = 0.40)
  w_tech:  0.30   # T: 기술적 체력 (이동평균·매물대)
  w_text:  0.40   # S_text: FinBERT 감성 (뉴스+공시)
  w_cross: 0.30   # D: 수급/관심 교차
  w1: 0.30        # 하위 호환용 (w_tech와 동일값 유지)
  w2: 0.40        # 하위 호환용 (w_text와 동일값 유지)
  w3: 0.30        # 하위 호환용 (w_cross와 동일값 유지)

  # FinBERT 모델
  finbert_model: "snunlp/KR-FinBert-SC"
  news_count: 10                   # 종목당 수집할 뉴스 헤드라인 수
  news_max_age_days: 14            # Task1: pubDate 기준 이보다 오래된 뉴스는 감성 분석 제외
  # Task4: shadow presurge 스코어링. 발송·등급은 항상 legacy score 기준.
  # 본 사이클에서는 false 고정 — outcomes로 IC 우위 검증 전 true 전환 금지.
  pre_surge_mode: false
  news_weight: 0.60                # S_text(표시·DB용 결합 감성) 안에서 뉴스 비중
  dart_weight: 0.40                # S_text(표시·DB용 결합 감성) 안에서 공시 비중

  # P1-4: news/dart 최종점수 독립 가중 (선택) — 아래 두 줄 주석 해제 시 활성화.
  #   백테스트 진단(2026-07): 뉴스 감성이 IC를 훼손(10일 IC≈-0.08), 공시는 무해(≈0).
  #   기존엔 news/dart가 w_text 하나로 묶여 뉴스만 낮출 수 없었음 → 이 두 값으로 분리 조절.
  #   미지정 시 기존과 완전 동일: w_news = w_text×news_weight(0.24), w_dart = w_text×dart_weight(0.16).
  #   활성화 시 검증 규칙: w_tech + w_news + w_dart + w_cross == 1.0
  #   (예: 뉴스 축소·공시 유지 → w_tech:0.30, w_news:0.05, w_dart:0.16, w_cross:0.49)
  # w_news: 0.24
  # w_dart: 0.16
  dart_days: 30                    # 공시 검색 기간 (일) — Task1: 90→30 (접수일 기준 창)

  # 교차 신호 조건
  n_accel_window: 3                # N-Accel: 과거 3거래일 내 엔진B 이력 + 오늘 엔진A → D+15
  v_surge_rank: 20                 # V-Surge 발화 기준(검색량 순위). 점수 미반영, 진단 플래그 전용

  # V-Surge(이진 +10) → 연속 과열 감점 교체.
  # 근거: outcomes 2,715건 / 39일 (20260523~20260710 진입, KOSDAQ 초과수익 fwd20).
  # 감점은 같은 날 후보들 사이의 상대 순위로 매기므로, 근거도 일자평균을 뺀
  # "같은 날 동료 대비"로 측정했다. pooled 수치를 쓰면 일자 효과에 속는다 —
  # 실제로 hype_slope의 pooled IC -0.062는 전부 일자 효과였고(날짜평균 hs vs
  # 날짜평균 ex20 = -0.393), 일자 내 monotone IC는 +0.003으로 사라진다.
  #
  #   · V-Surge 플래그 자체는 예측력 없음 — IC ex20 +0.010(p=0.62),
  #     발화군 -5.03%p vs 미발화군 -4.53%p. 그런데 발화하면 +10을 줬다.
  #   · 세 신호 모두 "일자 내 상위 20% 꼬리"에서만 작동한다(그래서 knee=0.80).
  #     일자평균 차감 후 해당군 vs 나머지, 셋 다 p<0.0001:
  #       V vol_slope  상위20% -3.81%p (t=-4.58) · 60~80% 구간은 +0.16%p 무효과
  #       H hype_slope 상위20% & slope>0 -4.08%p (t=-4.39) · 부호조건 빼면 -2.22로 약화
  #       C change_pct >=+7% -3.75%p (t=-4.17) · >=+5% -2.96 · >=+10% -4.41
  #   · 효과크기가 셋이 거의 같고 발화 개수만큼 단조로 누적된다:
  #       0개 n=1730 +1.39%p | 1개 n=566 -1.07 | 2개 n=362 -3.74 | 3개 n=57 -7.73
  #     → 가중치 균등 5/5/5 + 상한 15 로 이 계단을 그대로 재현한다.
  #   · 모양이 '기울기'가 아니라 경계에서의 '계단'이다. knee 0.60→1.00 완만 램프로
  #     처음 넣었더니 무효과 구간까지 깎아 IC 개선이 +0.003에 그쳤다. knee~full 폭을
  #     좁혀 계단에 가깝게 두되, 경계 한 칸 차이로 5점이 갈리지는 않게 남긴다.
  #
  #   · change_pct는 변동성 정규화하지 않는다. 종목 20일 표준편차로 나눈 z임계가
  #     오히려 약했다: 고정 >=7% t=-4.17(p<0.0001) vs z>=1.5 t=-2.34(p=0.020).
  #     고정 임계가 고변동 종목만 때리지도 않는다(발화율 12.4%~15.8%로 평탄).
  #   · 시장 변동성 국면에 따라 강도만 변하고 부호는 유지된다(발화개수별 dm):
  #       저변동장 +1.59 / -1.44 / -4.48 / -9.84   고변동장 +1.15 / -0.74 / -2.93 / -5.83
  #     고변동 국면에서 약 40% 약해진다. 지금처럼 변동성이 큰 장에서는 약한 쪽을 기대할 것.
  #
  # 교체 후 리플레이(2,715건, 일자평균 차감):
  #   감점>=5 vs <5 : -2.31%p vs +0.83%p (차 -3.14, t=-3.89, p=0.0001)
  #   일자내 IC     : -0.0813 → -0.0678   상위10% 추천군 -1.05%p → -0.69%p
  #   등급 강등 45건의 실제 성과 -1.78%p (전체 평균 0.00) — 강등이 맞았다
  #
  # enabled: false 로 두면 기존 V-Surge +10 동작으로 즉시 복귀한다.
  # 주의: 표본이 전 구간 평균 -22%인 하락장 한 국면이다. '과열이 나쁘다'는
  # 하락장에서 특히 강한 성질이라 상승장에서 약해지거나 뒤집힐 수 있다.
  # overheat_pen 컬럼에 실제 감점을 남기니 outcomes로 재검증할 것.
  overheat_penalty:
    enabled: true
    pct_knee:  0.80                # vol/hype 일자내 분위 80%부터 감점 시작
    pct_full:  0.85                # 0.85 분위에서 만점 감점 (좁은 폭 = 완만한 계단)
    w_vol:     5.0                 # 거래량 기울기 최대 감점
    w_hype:    5.0                 # 검색량 기울기 최대 감점 (hype_slope>0 일 때만)
    w_chg:     5.0                 # 당일 등락률 상단 최대 감점
    chg_knee:  5.0                 # 등락률 +5%부터 감점 시작 (편측 — 하락엔 미적용)
    chg_cap:  10.0                 # 등락률 +10%에서 최대
    max_total: 15.0                # 세 항목 합산 상한 (= 세 성분 전부 발화)
    # 분위 비교 모집단. 기본 0 = 당일 풀(기존 동작) — 이 값을 바꾸지 말 것.
    # 풀 축소(일 4~26종목)로 램프가 이진화된다는 우려로 만들었으나 리플레이가
    # 반박했다(2026-08-24): 램프값이 0/1로만 나오는 비율은 캘리브레이션 구간
    # (풀 40~236) 95.0%, 20일 누적 94.6%로 같다. 밴드 점유율은 모집단 크기가
    # 아니라 폭이 정한다(5%p면 어디서든 5%). 4개 지평 IC도 무차별이고, 누적
    # 모집단은 절대 기준이라 과열장에 동반 감점이 생겨(감점 비율 표준편차
    # 15.3→21.2%p) '같은 날 동료 대비'라는 설계를 훼손한다. 재검증 전용으로만 쓴다.
    ref_window_days:  0              # 0 = 기존 동작(당일 풀), 재검증 전용 옵션
                                     #   N = 직전 N개 스캔일 누적 분포를 모집단으로
    ref_min_n:      100              # 누적 표본이 이보다 적으면 당일 풀로 폴백
    ref_demean:   false              # true = 각 날 평균을 뺀 잔차끼리 비교

  # D 점수 상대 순위 기준
  strength_top_pct: 0.20           # 거래량·관심도 기울기 상위 20%일 때 강도 보너스

  # 병렬 호출 수 — Naver 검색 burst 한계 ~10/s 감안, 3 권장
  text_workers: 3                  # 뉴스/공시 텍스트 수집 병렬 워커

# ── 대조군 표본 기록 (pool_history) ───────────────────
# 스캔 통과 종목이 실제로 나은지 재려면 "통과 못 한 종목"이 있어야 한다. 지금은
# gated_tickers에 과열 배제분만 남아, 유니버스는 통과했지만 신호가 없던 종목과
# 하드필터에서 탈락한 종목이 기록되지 않는다. 그래서 비교 대상이 무작위 KRX
# 표본밖에 없었고, 그건 유니버스 미달 종목까지 섞여 비교가 성립하지 않았다.
#
# 전량 기록은 불가능하다 — POOL_A ~1,000개 중 POOL_B로 가는 건 3~5개뿐이라
# 하루 2,000행(2런)이 쌓인다. DB가 매 런 git에 커밋되므로 연 500K행은 감당 못 한다.
# 사유별 표본이면 통계적으로 충분하면서 하루 ~160행에 그친다.
control_sample:
  enabled: true
  per_reason: 40         # 탈락 사유별 표본 수 (사유 6종 + 무신호 1종)
  no_signal: 40          # 유니버스 통과했으나 신호 없음(POOL_A 미진입) 표본 수
  # 같은 날 두 런이 같은 종목을 뽑도록 scan_date로 시드를 고정한다. PK가
  # (scan_date,ticker,stage)라 중복 삽입은 자연히 합쳐지고 행이 낭비되지 않는다.
  track_outcomes: true   # track_outcomes.py가 이 표본의 성과도 추적할지
                         # 끄면 대조군 성과를 못 재지만 런타임 부담이 없다

# ── Step 4: 등급 임계값 ────────────────────────────────
# 2026-05-22 00:49 run과 동일 분포를 위해 75/65 적용
grade:
  # 등급(집중/주시/참고)은 발송·표시에서 폐지했다. 아래 두 임계는 DB의 grade 컬럼을
  # 계속 채우기 위해서만 남는다 — 과거 데이터와 비교가 끊기면 weekly_report와
  # 대시보드 이력 분석이 깨진다.
  #
  # 폐지 근거: 점수가 성과 순위를 만들지 못했다(D+1 시가 진입, 10일 내 최고가 기준).
  #   등급별 +10% 도달률  참고 40.3% > 집중 37.2% > 주시 29.6%   ← 순서가 뒤집힘
  #   점수대별 평균 최고상승  50~55 구간 15.03 최상 / 70점 이상 6.80 최악
  #   일자내 IC -0.068 (누적 관찰 횟수는 +0.187)
  # 무엇보다 🔴집중이라는 표시는 받는 쪽에서 매수 신호로 읽힌다. 경고 문구로는
  # 매일 오는 알림의 인상을 이기지 못해, 라벨 자체를 없애는 편이 정직하다.
  high_interest: 75                # (분석 전용) grade='집중' 기록 기준
  interest: 70                     # (분석 전용) grade='주시' 기록 기준

  # 발송 하한. 60 → 45.
  #   60은 최근 30일 기준 하루 0.9종목으로 사실상 발송이 멈춘 값이었다.
  #   45~50 구간(추가로 들어오는 510건)은 기존 >=50 대비 평균 9.36 vs 10.76이지만
  #   p=0.100으로 구분되지 않고, +10% 도달률(37.6% vs 36.9%)과 중앙값(5.72 vs 4.71)은
  #   오히려 앞선다. 하루 0.9 → 4.8종목으로 늘어 일자내 순위와 지표 검증이 가능해진다.
  #   40 이하로는 내리지 말 것 — 성과가 확실히 떨어진다(>=40 평균 10.20 vs >=45 10.47).
  min_display_score: 45

# ── 리스크 키워드 ─────────────────────────────────────
# 뉴스 헤드라인에 포함 시 neg_ratio 상승 → 30% 이상이면 엔진 B 신호 차단
negative_keywords:
  - "배임"
  - "횡령"
  - "유상증자"
  - "하한가"
  - "상장폐지"
  - "불성실공시"
  - "감사의견거절"
  - "자본잠식"
  - "회계감리"
  - "검찰"
  - "구속"

name: AlphaRadar Afterhours (NXT)

# NXT 애프터마켓(15:40~20:00 KST) 상승 종목 관찰 로깅.
# 관찰 전용이다 — 점수 파이프라인에 들어가지 않고 텔레그램도 쏘지 않는다.
#
# 크론 시각 근거: 애프터마켓 수량·대금을 NXT 분봉(과거 데이터)에서 뽑으므로
# 장중에 붙어 있을 필요가 없다. 20:00 KST 마감 뒤에 돌리면 15:40~20:00 구간이
# 완결된 상태로 잡힌다 — 늦게 도착할수록 완전해진다.
#
# 단, 그 말이 참인 것은 자정까지다. 분봉 조회가 FHKST03010200(주식'당일'분봉)
# 이라 날짜가 넘어가면 어제 15:40~20:00 은 영영 못 뽑는다. 유효 창은
# 15:40~24:00 KST = 06:40~15:00 UTC 이고, 구간이 완결되는 것은 20:00 KST
# (11:00 UTC) 부터다.
#
# 크론이 하나(11:30 UTC)뿐이던 동안 GitHub의 이벤트 발사 지연이 그 3시간 30분
# 여유를 통째로 먹었다. 2026-08-27 ~ 09-09 실측 발사 지연:
#   3h31m · 3h34m · 3h40m · 3h42m · 3h59m · 5h03m · 6h33m · 9h34m · 9h57m
# 열 번 중 아홉 번이 자정을 넘겼고, 그때마다 스캐너가 '개시 전'으로 읽고
# exit 0 해서 워크플로는 초록불로 끝났다. 8/26 이후 적재 0건을 그래서 몰랐다.
#
# 그래서 창 안에 착지할 기회를 셋으로 늘린다. 지연 중앙값 ~3h40m 기준
# 10:00 → 13:40 UTC, 11:00 → 14:40 UTC 가 창 안이고, 12:00 은 정시에 가깝게
# 도착할 때를 받는다. save() 가 (scan_date, code) PK 로 INSERT OR REPLACE 라
# 여러 번 돌아도 안전하고, 늦게 도착한 쪽이 더 완결된 스냅샷으로 덮어쓴다.
# 자정을 넘겨 도착한 뒷차는 앞차가 이미 적재했으면 조용히 종료하고,
# 아무도 적재하지 못했을 때만 exit 1 로 빨갛게 선다.
on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '개시(15:40 KST) 전에도 강제 실행'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# daily 런과 같은 그룹이다. 둘 다 data/scores_history.db(바이너리)를 푸시하는데,
# 별도 그룹이던 동안 저녁 daily 도착(11:40~14:00 UTC)과 afterhours 커밋
# (14:00 UTC 전후)이 정면으로 겹쳤다. afterhours 는 --replay 로 살아남지만
# daily 는 rebase 실패 시 결과를 버린다 — 2026-09-09·09-10 저녁 런이
# 그렇게 사라졌다(발송은 됐고 DB·로그만 유실).
#
# 한 큐에 세워 경합을 원천 제거한다. 취소하지 않으니 afterhours 가 daily 뒤로
# 30~40분 밀릴 수 있고, 그건 허용한다 — 분봉 유효 창이 24:00 KST(15:00 UTC)
# 까지라 아직 여유가 있다. 아래 push 재시도의 --replay 는 그대로 둔다
# (PR 머지 등 다른 원인으로 원격이 움직이는 경우가 남는다).
concurrency:
  group: alpharadar-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 러너는 일회용이라 체크아웃 시점의 DB가 원격보다 뒤처져 있을 수 있다.
      # 실행 직전에 한 번 당겨두면 push 충돌 확률이 크게 줄어든다.
      - name: Sync latest DB
        run: git pull --rebase origin main || true

      - name: Run afterhours scanner
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_IS_REAL:    '1'
        run: |
          python afterhours_scanner.py \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit & push
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name  "alpharadar-bot"
          # 유니버스 캐시도 같이 올린다. pykrx가 되살아나면 그 결과가
          # '마지막 성공분'으로 남아야 다음 런의 폴백이 최신이 된다.
          git add data/scores_history.db data/cache/universe_k200_kq150.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "적재된 행 없음(창 밖이거나 포착 0건) · 유니버스 변동 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "auto: afterhours $(date -u +%F\ %H:%M\ UTC) [skip ci]"

          # DB는 바이너리라 rebase로 병합할 수 없다. 원격이 움직였으면 원격 DB를
          # 그대로 받아들이고, 이번 런이 뽑은 행만 --replay 로 다시 얹는다.
          # 저녁 시세는 소급 수집이 불가능하니 조용히 버리면 안 된다.
          # afterhours_rows.json 은 untracked라 reset --hard 후에도 남는다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            echo "푸시 거부됨 — 원격 DB 채택 후 재적재 ($i/5)"
            git fetch origin main
            git reset --hard origin/main
            python afterhours_scanner.py --replay afterhours_rows.json || exit 1
            git add data/scores_history.db
            git commit -m "auto: afterhours $(date -u +%F\ %H:%M\ UTC) [skip ci]"
            sleep $((i * 5))
          done
          echo "::error::5회 재시도 후에도 푸시 실패"
          exit 1

      - name: Upload rows on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afterhours-rows
          path: afterhours_rows.json
          if-no-files-found: ignore

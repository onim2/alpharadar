name: AlphaRadar Daily Run

# ─── 실행 트리거 ─────────────────────────────────────────
on:
  schedule:
    # 크론은 UTC 기준이다. KST 월요일 06:10 = UTC 일요일 21:10 이므로
    # 아침 런의 요일을 0-4(일~목)로, 저녁 런은 1-5(월~금)로 지정한다.
    #
    # Actions 큐 지연은 없앨 수 없어 마진으로 흡수한다.
    # 실측(스케줄 런 40회): 아침 지연 중앙 56분(50~63분에 19/20 집중),
    # 저녁 지연 중앙 117분. 지연 자체는 안정적이다.
    # 변동이 큰 쪽은 스캔 소요시간으로 8~33분까지 흔들린다(POOL_B 종목 수에
    # 따라 뉴스·공시 수집량이 달라짐). 마진은 이쪽을 흡수하기 위한 것이다.

    # 아침 — KST 월~금 06:10 (장 시작 2시간 50분 전)
    # 07:40 → 06:40 → 06:10 으로 두 번 당겼다. 06:40일 때 도착 중앙값이
    # 09:02로 여전히 개장(09:00) 언저리였다. 30분 더 확보해 08:30대를 노린다.
    # 드물게 3시간 넘는 지연이 나오는데(8/7 204분) 어떤 값으로도 못 막는다.
    - cron: '10 21 * * 0-4'

    # 저녁 — KST 월~금 18:40 (장 마감 3시간 10분 후)
    # 지연이 커서 실제 도착은 KST 21~22시대.
    - cron: '40 9 * * 1-5'

  workflow_dispatch:        # 수동 실행 버튼 활성화
    inputs:
      dry_run:
        description: 'dry-run 모드 (텔레그램 발송 X)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      limit:
        description: '종목 제한 (빈 값 = 전체)'
        required: false
        default: ''
        type: string

# 동시 실행 방지 (이전 실행 진행 중이면 큐에 넣기)
concurrency:
  group: alpharadar-daily
  cancel-in-progress: false

permissions:
  contents: write           # DB·캐시 자동 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-snunlp-v1
          restore-keys: hf-finbert-

      - name: Cache daily text/investor data
        uses: actions/cache@v4
        with:
          path: |
            data/cache/news_titles_*.pkl
            data/cache/news_items_*.pkl
            data/cache/dart_items_*.pkl
            data/cache/dart_titles_*.pkl
            data/cache/kis_investor_*.pkl
          key: alpharadar-daily-${{ github.run_id }}
          restore-keys: alpharadar-daily-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'transformers>=4.30' 'torch>=2.0' --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run AlphaRadar
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_REAL:    ${{ secrets.KIS_IS_REAL }}
          DART_API_KEY:   ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_CLIENT_ID_2:     ${{ secrets.NAVER_CLIENT_ID_2 }}
          NAVER_CLIENT_SECRET_2: ${{ secrets.NAVER_CLIENT_SECRET_2 }}
          NAVER_CLIENT_ID_3:     ${{ secrets.NAVER_CLIENT_ID_3 }}
          NAVER_CLIENT_SECRET_3: ${{ secrets.NAVER_CLIENT_SECRET_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TQDM_DISABLE: '1'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          echo "실행 인자: python alpharadar.py $ARGS"
          python alpharadar.py $ARGS

      - name: Track forward outcomes
        if: success()
        continue-on-error: true      # 추적 실패해도 스캔 발송 결과에 영향 없음
        run: |
          echo "forward outcomes 추적 실행"
          python track_outcomes.py

      - name: Commit DB & DART master cache
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name  "alpharadar-bot"
          git add data/scores_history.db              2>/dev/null || true
          git add data/cache/dart_sector_map.pkl      2>/dev/null || true
          git add data/cache/dart_sector_map_v2.pkl   2>/dev/null || true
          git add data/cache/dart_corp_codes.pkl      2>/dev/null || true
          git add data/logs/scanner_*.log             2>/dev/null || true
          if git diff --staged --quiet; then
            echo "커밋할 변경사항 없음"
            exit 0
          fi
          git commit -m "auto: daily run $(date -u +%F\ %H:%M\ UTC) [skip ci]"

          # 런은 30~40분 걸린다. 그 사이 원격 main이 움직이면(다른 런, PR 머지)
          # push가 거부되고, 러너는 일회용이라 스캔 결과가 통째로 사라진다.
          # 실측: 2026-08-05 저녁 런이 PR 머지와 겹쳐 기사 39건을 잃었다.
          # rebase 후 재시도한다. DB가 양쪽에서 바뀌어 rebase가 실패하면
          # 조용히 한쪽을 고르지 않고(바이너리라 병합 불가) 중단한다 —
          # 그 경우 아래 아티팩트로 결과를 건져낼 수 있다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            echo "푸시 거부됨 — 원격 변경 반영 후 재시도 ($i/5)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebase 실패(DB 충돌 추정) — 결과를 아티팩트로 남긴다"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::5회 재시도 후에도 푸시 실패"
          exit 1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7

      # 푸시가 끝내 실패하면 스캔 결과가 러너와 함께 사라진다. DB를 남겨
      # 수동으로 복구할 수 있게 한다.
      - name: Upload DB on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scores-db-${{ github.run_id }}
          path: data/scores_history.db
          retention-days: 14
